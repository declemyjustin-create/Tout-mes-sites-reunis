<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Mannequin de face équipé pour le débroussaillage</title>
  <desc id="description">Une silhouette de face portant un casque avec visière et protections auditives, une veste ajustée, des gants, un pantalon couvrant et des chaussures de sécurité.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#315d49" opacity=".12"/>
    </pattern>
    <linearGradient id="visor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#b9c9bd" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#fbfaf6"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <path d="M470 638h260" fill="none" stroke="#dedfd4" stroke-width="2"/>

  <g stroke="#35443b" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <!-- Face and neck -->
    <path d="M566 119q0-42 34-42t34 42v37q0 34-34 47-34-13-34-47z" fill="#d99c78"/>
    <path d="M586 180v30m28-30v30" fill="#d99c78"/>
    <!-- Helmet, earmuffs, and visor -->
    <path d="M558 112q4-48 42-51 38 3 42 51l-8 8h-68z" fill="#e27a4e"/>
    <path d="M548 118q52-10 104 0 8 2 5 9-56 9-114 0-3-7 5-9z" fill="#f2a375"/>
    <path d="M552 125q-13 2-12 17l3 19q2 9 11 7l7-3v-39zm96 0q13 2 12 17l-3 19q-2 9-11 7l-7-3v-39z" fill="#315d49"/>
    <path d="M558 132l-8 60q3 17 50 19 47-2 50-19l-8-60q-42 10-84 0z" fill="url(#visor)" stroke="#315d49" stroke-width="4"/>
    <path d="M575 155q12-7 24 0m4 0q12-7 24 0m-26 1h4" fill="none" stroke="#315d49" stroke-width="4"/>
    <!-- Fitted jacket torso -->
    <path d="M566 203l-34 8q-21 7-30 27l-17 63q28 16 53 5l9-45 3 103q50 21 100 0l3-103 9 45q25 11 53-5l-17-63q-9-20-30-27l-34-8-34 13z" fill="#8a9d48"/>
    <path d="M600 216v144m-31-132 13 19m49-19-13 19" fill="none" stroke="#64743c" stroke-width="4"/>
    <path d="M510 301l30 8m120-8-30 8" fill="none" stroke="#f2eee0" stroke-width="8"/>
    <path d="M548 271l-8 31m120-31 8 31" fill="none" stroke="#6f803f" stroke-width="3"/>
    <!-- Sleeves shaped along the arms -->
    <path d="M535 211q-20 5-30 26l-35 104q-3 10 5 15l12 6q9 3 14-7l37-78 13-38z" fill="#8a9d48"/>
    <path d="M665 211q20 5 30 26l35 104q3 10-5 15l-12 6q-9 3-14-7l-37-78-13-38z" fill="#8a9d48"/>
    <path d="M481 336l28 11m210-11-28 11" fill="none" stroke="#f2eee0" stroke-width="7"/>
    <!-- Hands and protective gloves -->
    <path d="M467 352q-9 2-12 12l-5 19q-2 9 7 12l13 3q10 1 13-9l5-18q3-10-6-15z" fill="#e27a4e"/>
    <path d="M733 352q9 2 12 12l5 19q2 9-7 12l-13 3q-10 1-13-9l-5-18q-3-10 6-15z" fill="#e27a4e"/>
    <!-- Straight fitted trouser legs aligned with the torso -->
    <path d="M548 361q52 18 104 0l-2 59q-2 16-12 25v125q-13 6-26 0V450q-12-6-24 0v120q-13 6-26 0V445q-10-9-12-25z" fill="#536b5c"/>
    <path d="M548 401q52 14 104 0m-52 15v31m-25 31v52m50-52v52" fill="none" stroke="#40574a" stroke-width="4"/>
    <!-- Safety boots -->
    <path d="M562 561l25 2 3 36-17 18-27-5q-8-5-2-14z" fill="#42594d"/>
    <path d="M613 563l25-2 18 37q6 9-2 14l-27 5-17-18z" fill="#42594d"/>
    <path d="M546 613l42 5m31-5 42-5" fill="none" stroke="#e27a4e" stroke-width="7"/>
  </g>

  <g fill="#1e3028" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="34" font-size="15" font-weight="700" letter-spacing="2">ÉQUIPEMENTS DE PROTECTION</text>
    <text x="600" y="657" font-size="10" font-weight="700" letter-spacing="1">ÉQUIPEMENTS À ADAPTER À LA NOTICE DE LA MACHINE</text>
  </g>
</svg>
